---
# Add Downloads to the list
- name: Install Additional Pacakges
  yum:
   name:
    - scap-security-guide.noarch
  state: present
  become: true
  become_user: root
  when: ansible_distribution == "OracleLinux" and ansible_distribution_major_version >= '7'
  tags: [dependencies Oracle7]

- name: Download Yara
  get_url: https://github.com/VirusTotal/yara/archive/refs/tags/v{yara_version}.tar.gz
  dest: /tmp/yara-{yara_version}.tar.gz
  mode: u=rw
  when: ansible_distribution == "OracleLinux" and ansible_distribution_major_version >= '7'
        and yara_enabled == true
  tags: [dependencies Oracle7]
