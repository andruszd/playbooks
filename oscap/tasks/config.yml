# Configure Applications


- name: populate zookeeper conf file with config
  template:
    src: templates/zoo.cfg.j2
    dest: "{{ zookeeper_conf_dir }}/zoo.cfg"
    owner: zookeeper
    group: zookeeper
    mode: u=rw,g=r,o=r
    backup: true
  when:
  - zookeeper_user is defined
  - zookeeper_group is defined
  - zookeeper_enabled == true

- name: zookeeper service file
  template:
    src: templates/zookeeper.service.j2
    dest: "/etc/systemd/system/zookeeper.service"
    owner: root
    group: root
    mode: u=rw,g=r,o=r
    backup:
  when:
  - zookeeper_user is defined
  - zookeeper_group is defined
  - zookeeper_enabled == true


- name: enable  service
  systemd:
    name:
    enabled: yes
  when:
  - _user is defined
  - _group is defined
  - _enabled == true

- name: reload systemd deamon
  systemd:
    daemon_reload: yes

