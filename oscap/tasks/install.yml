- name: Set up bash_rc
  tags: bashrc
  blockinfile:
    path: /root/.bashrc
    create: true
    backup: true
    block: |
      shopt -s histappend histreedit histverify
      shopt -s no_empty_cmd_completion
      export HISTCONTROL=ignoreboth:erasedups
      export HISTTIMEFORMAT="%Y-%m-%d:%T:-> "
      export HISTIGNORE="pwd:bg:fg:history"
      export HISTFILE=$HOME/.bash_history
      export HISTFILESIZE=1000000000
      export HISTSIZE=10000000
  when: bashrc == true

- name: Source the bashrc file
  shell: source /root/.bashrc
  when: bashrc == true

# Create Directory Structure for the Application
- name: create oscap directory
  tags: oscap_dir
  file:
    path: /var/ossec/wodles/oscap
    state: directory
    owner: "{{ root_user }}"
    group: "{{ wazuh_group }}"
    mode: u=rwx,g=rx,o=rx
  become: true
  when: oscap_enabled == true

- name: create oscap content directory
  tags: oscap_content_dir
  file:
    path: /var/ossec/wodles/oscap/content
    state: directory
    owner: "{{ root_user }}"
    group: "{{ wazuh_group }}"
    mode: u=rwx,g=rx,o=rx
  become: true
  when: oscap_enabled == true

- name: Create Yara Rules Directory
  file:
    path: /var/ossec/wodles/yara-rules
    state: directory
    owner: "{{ root_user }}"
    group: "{{ wazuh_group }}"
    mode: u=rwx
  become: true
  when: yara_enabled == true
# Add mount points
