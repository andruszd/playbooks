---
- name: Configure Enviroment Files
  vars:
     dahostname: "{{ hostvars[inventory_hostname] }}"

  template:
     src: "{{ item.src }}"
     dest: "{{ item.dest }}"
     owner: "{{ item.owner }}"
     group: "{{ item.group }}"
     mode: "{{ item.mode }}"
  with_items:
     - {src: "templates/zookeeper/zookeeper.j2",
        dest: "{{ zookeeper_conf_dir }}/zoo.cfg",
        owner: "{{ zookeeper_user }}",
        group: "{{ zookeeper_group }}",
        mode: u=rw, g=r, o=r}
     - {src: "templates/zookeeper/zook.env.j2",
        dest: "{{ zookeeper_conf_dir }}/zoo.env",
        owner: "{{ zookeeper_user }}",
        group: "{{ zookeeper_group }}",
        mode: u=rw, g=r, o=r}
