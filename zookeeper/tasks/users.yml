---
- name: ensure group zookeeper exists
  group:
    name: zookeeper
    state: present
  become: true

- name: create zookeeper user
  user:
    name: "{{ zookeeper_user }}"
    group: "{{ zookeeper_group }}"
    state: present
    create_home: true
  become: true
  when: zookeeper_user is defined and zookeeper_group is defined
