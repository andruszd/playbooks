---
- name: Crypto Policies
  yum:
    name: crypto-policies
    state: latest
  tags: [crypto]

- name: Configure Crypto Policies
  command: update-crypto-policies --set FUTURE
  become: true
  tags: [crypto]

- name: Disable IPv4 Forwarding
  command: grep -Els "^\s*net\.ipv4\.conf\.all\.rp_filter\s*=\s*0" \
      /etc/sysctl.conf /etc/sysctl.d/*.conf /usr/lib/sysctl.d/*.conf \
      /run/sysctl.d/*.conf | \
      while read filename; \
      do sed -ri \
      "s/^\s*(net\.ipv4\.net.ipv4.conf\.all\.rp_filter\s*)(=)(\s*\S+\b).*$/# *REMOVED* \1/" \
      $filename; done
  become: true
  tags: [network]

- name: Enable Path Filtering
  command: sysctl -w net.ipv4.conf.all.rp_filter=1 \
    sysctl -w net.ipv4.route.flush=1 \
    sysctl -w net.ipv4.route.flush=1 \
    sysctl -w net.ipv6.route.flush=1
  become: true
  tags: [network]

- name: Turn Wifi Off
  command: nmcli radio wifi off
  become: true
  tags: [network]
