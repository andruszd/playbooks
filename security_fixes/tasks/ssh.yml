---
- name: SSH Permissions
  command: find /etc/ssh -xdev -type f -name 'ssh_host_*_key' \
    -exec chown root:root {} +
  tags:
    - ssh
- name: SSH Permissions
  command: find /etc/ssh -xdev -type f -name 'ssh_host_*_key' \
    -exec chmod 0600 {} +
  tags:
    - ssh

- name: SSH Configuration
  template:
    src: "templates/sshd_config.j2"
    dest: "/etc/ssh/sshd_config"
    owner: root
    group: root
    mode: u=rw,g=r,o=r
  notify: Reload sshd
  backup: true
  tags:
    - ssh
