- name: Set up bash_rc
  blockinfile:
    path: /root/.bashrc
    create: true
    backup: true
    block: |
       shopt -s histappend histreedit histverify
       shopt -s no_empty_cmd_completion
       export HISTCONTROL=ignoreboth:erasedups
       export HISTTIMEFORMAT="%Y-%m-%d:%T:-> "
       export HISTIGNORE="pwd:bg:fg:history"
       export HISTFILE=$HOME/.bash_history
       export HISTFILESIZE=1000000000
       export HISTSIZE=10000000

- name: Source the bashrc file
  shell: source /root/.bashrc

# Install yara
- name: Install Yara
  include_tasks:
    file: tasks/yara.yml
    apply:
      tags:
        - yara
# Create Directory Structure

# Setup Appliacation Enviroment Files

- name: Set up java.sh in /etc/profile.d/
  template:
    src: "files/java.sh"
    dest: "/etc/profile.d/java.sh"
    owner: root
    group: root
    mode: u=rw,g=r,o=r
    backup: true

# Firewall Configuration Files for OS
- name: setup  firewall ports
  template:
    src: "files/spec.xml"
    dest: "/usr/lib/firewalld/services"
    owner: root
    group: root
    mode: u=rw,g=r,o=r
    backup: true
  when: service_enabled == true

- name: restart firewalld
  service:
    name: firewalld
    state: restarted
    enabled: true

# Activate Application Specific Firewall Rules.
- name: add service to firewalld
  firewalld:
    service: servce
    permanent: true
    state: enabled
    immediate: true
  when: service_enabled == true

# Reload the firewalld deamon
- name: reload firewalld deamon
  firewalld:
    daemon_reload: true

# Cleanup the RAM
# After installation clean the RAM so that we get the required free space.
- name: Clean Ram Cache
  copy:
    content: 3
    dest: /proc/sys/vm/drop_caches
    unsafe_writes: true
  become: true
