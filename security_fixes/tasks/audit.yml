---
- name: Configure Auditd
  yum:
    name: audit
    state: latest
  tags: [auditd]

- name: Auditd Configuration
  template:
    src: "templates/auditd.conf.j2"
    dest: "/etc/audit/auditd.conf"
    owner: root
    group: root
    mode: u=rw,g=r,o=r
  notify: Reload auditd
  tags: [auditd]

- name: Install Audit rules
  template:
    src: "{{ item.src }}"
    dest: "{{ item.dest }}"
    owner: "{{ item.owner }}"
    group: "{{ item.group }}"
    mode: "{{ item.mode }}"
    backup: true
    with_items:
      - src: "files/audit/10-base.rules"
        dest: "{{ auditd_rules }}/10-base.rules"
        owner: root
        group: root
        mode: u=rw,g=r,o=r
      - src: "files/audit/10-no-audit.rules"
        dest: "{{ auditd_rules }}/10-no-audit.rules"
        owner: root
        group: root
        mode: u=rw,g=r,o=r
      - src: "files/audit/11-loginuid.rules"
        dest: "{{ auditd_rules }}/11-loginuid.rules"
        owner: root
        group: root
        mode: u=rw,g=r,o=r
      - src: "files/audit/12-cont-fail.rules"
        dest: "{{ auditd_rules }}/12-cont-fail.rules"
        owner: root
        group: root
        mode: u=rw,g=r,o=r
      - src: "files/audit/20-donot-audit.rules"
        dest: "{{ auditd_rules }}/20-do-not-audit.rules"
        owner: root
        group: root
        mode: u=rw,g=r,o=r
      - src: "files/audit/21-no32bit.rules"
        dest: "{{ auditd_rules }}/21-no32bit.rules"
        owner: root
        group: root
        mode: u=rw,g=r,o=r
      - src: "files/audit/21-no64bit.rules"
        dest: "{{ auditd_rules }}/21-no64bit.rules"
        owner: root
        group: root
        mode: u=rw,g=r,o=r
      - src: "files/audit/21-noexec.rules"
        dest: "{{ auditd_rules }}/21-noexec.rules"
        owner: root
        group: root
        mode: u=rw,g=r,o=r }
      - src: "files/audit/21-nosuid.rules"
        dest: "{{ auditd_rules }}/21-nosuid.rules"
        owner: root
        group: root
        mode: u=rw,g=r,o=r
      - src: "files/audit/22-ingnore-chrony.rules"
        dest: "{{ auditd_rules }}/22-ignore-chrony.rules"
        owner: root
        group: root
        mode: u=rw,g=r,o=r
      - src: "files/audit/23-ignore-filesystem.rules"
        dest: "{{ auditd_rules }}/23-ignore-filesystem.rules"
        owner: root
        group: root
        mode: u=rw,g=r,o=r
      - src: "files/audit/30-nispom.rules"
        dest: "{{ auditd_rules }}/30-nispom.rules"
