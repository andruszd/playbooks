        mode: u=rw,g=r,o=r
      - src: "files/audit/99-finalize.rules"
        dest: "{{ auditd_rules }}/99-finalize.rules"
        owner: root
        group: root
        mode: u=rw,g=r,o=r

- name: Reload auditd
  systemd:
    name: auditd
    state: restarted
    enabled: true
    daemon_reload: true
  tags: [auditd]
