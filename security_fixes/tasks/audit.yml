        owner: root
        group: root
        mode: u=rw,g=r,o=r
      - src: "files/audit/30-ospp-v42-6-owner-change-success.rules"
        dest: "{{ auditd_rules }}/30-ospp-v42-6-owner-change-success.rules"
        owner: root
