---
# Configure Applications

# - name: file
#   template:
#     src: templates/.service.j2
#     dest: "/etc/systemd/system/.service"
#     owner: root
#     group: root
#     mode: u=rw,g=r,o=r
#     backup:
#   when:
#   - _user is defined
#   - _group is defined
#   - _enabled == true
- name: configure applications
  tags: config_apps
  debug:
    msg: "Configuring Applications"

- name: service directory for rabbitmq
  file:
    path: /etc/systemd/system/rabbitmq-server.service.d/
    state: directory
    owner: "{{ root_user }}"
    group: "{{ root_group }}"
    mode: u=rwx,g=rx,o=rx

# RabbitMQ Limits Configuration
- name: RabbitMQ Limits Configuration
  tags: rabbitmq_limits
  template:
    src: files/limits.conf
    dest: /etc/systemd/system/rabbitmq-server.service.d/limits.conf
    owner: "{{ root_user }}"
    group: "{{ root_group }}"
    mode: u=rw,g=r,o=r
    backup: true
  when:
    rabbitmq_limits == true
