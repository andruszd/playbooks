#   when:
#   - _user is defined
#   - _group is defined
#   - _enabled == true

# Reload Systemd to pick up new config files
- name: reload systemd deamon
  systemd:
    daemon_reload: true

# Enable Services
- name: enable service
  systemd:
    name: rabbitmq-server
    enabled: ture
  when:
    - rabbitmq_user is defined
    - rabbitmq_group is defined
    - rabbitmq_enabled == true

# Start Services
- name: start service
  systemd:
    name: rabbitmq-server
    state: started
  when:
    - rabbitmq_user is defined
    - rabbitmq_group is defined
    - rabbitmq_started == true

# Status of the Service
- name: status of the service
  systemd:
    name: rabbitmq-server
    state: status
  when:
    - rabbitmq_user is defined
    - rabbitmq_group is defined
    - rabbitmq_status == true
