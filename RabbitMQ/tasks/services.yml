---
# Add Firewall Rules
- name: Rabbitmq Firewall Rules
  tags: rabbitmq_firewall
  src: files/rabbitmq-fire-rule.xml
  dest: /etc/firewalld/services/rabbitmq.xml
  owner: root
  group: root
  mode: u=rw,g=r,o=r
  backup: true
  when:
    rabbitmq_firewall == true
  notify: restart firewalld

# Reload the firewalld service
- name: reload firewalld
  tags: reload_firewalld
  service:
    name: firewalld
    state: reloaded
    enabled: true

# Acctivate the firewalld service
- name: acctivate firewall rule
  command: firewall-cmd --add-service=rabbitmq --permanent
  when:
    rabbitmq_firewall == true

# Restart the firewalld service
- name: restart firewalld
  tags: restart_firewalld
  service:
    name: firewalld
    state: restarted
    enabled: true

- name: Services
  debug:
    msg: "Processing Services"
# Add Services
# - name: file
#   template:
#     src: templates/.service.j2
#     dest: "/etc/systemd/system/.service"
#     owner: root
#     group: root
#     mode: u=rw,g=r,o=r
