---
- name: Configure Enviroment Files
  vars:
     dahostname: "{{ hostvars[inventory_hostname] }}"

  template:
    src: "{{ item.src }}"
    dest: "{{ item.dest }}"
    owner: "{{ item.owner }}"
    group: "{{ item.group }}"
    mode: "{{ item.mode }}"
  with_items:
    - { src: "templates/pinot/controller.env.j2",
        dest: "{{ pinot_controller_env_file }}",
        owner: "{{ pinot_user }}",
        group: "{{ pinot_group }}",
        mode: "0644" }
    - { src: "templates/pinot/broker.env.j2",
        dest: "{{ pinot_broker_env_file }}",
        owner: "{{ pinot_user }}",
        group: "{{ pinot_group }}",
        mode: "0644" }
    - { src: "templates/pinot/server.env.j2",
        dest: "{{ pinot_server_env_file }}",
        owner: "{{ pinot_user }}",
        group: "{{ pinot_group }}",
        mode: "0644" }
    - { src: "templates/pinot/minion.env.j2",
        dest: "{{ pinot_minion_env_file }}",
        owner: "{{ pinot_user }}",
        group: "{{ pinot_group }}",
        mode: "0644" }
    - { src: "templates/zookeeper/zook.env.j2",
        dest: "{{ zookeeper_conf_dir }}/zoo.env",
        owner: "{{ zookeeper_user }}",
        group: "{{ zookeeper_group }}",
        mode: "0644" }