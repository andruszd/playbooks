---
# MOVE STARTING HERE TO YOUR MAIN YML FILE AND EDIT FOR YOUR ENVIRONMENT
domain_name: localdomain.com
location: home
cluster_name: pinot
# Environment Configuration = dev, test, prod, qa, uat
sys_env: dev
pinot_version: 1.0.0
zookeeper_version: 3.8.4
hadoop_version: 3.3.5
hadoop_guava_version: 27.0
hadoop_gson_version: 2.2.4
# Zookeeper Configuration
zookeepers:
      - name: ptzkpr01
        ip: 10.10.1.101
        myid: 1
      - name: ptzkpr02
        ip: 10.10.1.102
        myid: 2
      - name: ptzkpr03
        ip: 10.10.1.103
        myid: 3
# MOVE ENDING HERE TO YOUR MAIN YML FILE AND EDIT FOR YOUR ENVIRONMENT
# Service Configuration
kerberos_enabled: false
zookeeper_enabled: true
zookeeper_local: false
hdfs_enabled: false
pinot_enabled: true
deep_store: false
# Pinot Configuration
pinot_download_url: "https://downloads.apache.org/incubator/pinot/apache-pinot-{{ pinot_version }}/apache-pinot-{{ pinot_version }}-bin.tar.gz"
pinot_download_dest: /tmp/apache-pinot-{{ pinot_version }}-bin.tar.gz
pinot_user: pinot
pinot_group: pinot
pinot_home: /usr/lib/pinot
pinot_conf_dir: "/etc/pinot/conf"
pinot_data_dir: /data/pinot
pinot_log_dir: /var/log/pinot
pinot_pid_dir: /var/run/pinot
pinot_tmp_dir: /tmp/pinot
pinot_controller_port: 9000
pinot_broker_port: 8099
pinot_server_port: 8098
pinot_minion_port: 8097
pinot_admin_port: 9001
pinot_zookeeper_port: 2181
# Pinot Controller Configuration
pinot_controller_host: "{{ hostvars[inventory_hostname] }}"
pinot_controller_host_string: "{{ pinot_controller_host }}:{{ pinot_controller_port }}"
pinot_controller_env_file: "{{ pinot_conf_dir }}/controller.env"
pinot_controller_config_file: "{{ pinot_conf_dir }}/controller.conf"
# Pinot Broker Configuration
pinot_broker_host: "{{ hostvars[inventory_hostname] }}"
pinot_broker_env_file: "{{ pinot_conf_dir }}/broker.env"
pinot_broker_config_file: "{{ pinot_conf_dir }}/broker.conf"
# Pinot Server Configuration
pinot_server_host: "{{ hostvars[inventory_hostname] }}"
pinot_server_env_file: "{{ pinot_conf_dir }}/server.env"
pinot_server_config_file: "{{ pinot_conf_dir }}/server.conf"
# Pinot Minion Configuration
pinot_minion_host: "{{hostvars[inventory_hostname] }}"
pinot_minion_env_file: "{{ pinot_conf_dir }}/minion.env"
pinot_minion_config_file: "{{ pinot_conf_dir }}/minion.conf"
# For using Zookeeper locally for testing purposes
pinot_zookeeper_data_dir: "{{ pinot_data_dir }}/zookeeper"
pinot_zookeeper_log_dir: "{{ pinot_log_dir }}/zookeeper"
pinot_zookeeper_pid_dir: "{{ pinot_pid_dir }}/zookeeper"
pinot_zookeeper_tmp_dir: "{{ pinot_tmp_dir }}/zookeeper"
pinot_zookeeper_servers: "{{ zookeepers | map(attribute='ip') | list }}"
pinot_zookeeper_servers_string: "{{ pinot_zookeeper_servers | join(',') }}"
# Zookeeper Configuration
zookeeper_download_url: "https://dlcdn.apache.org/zookeeper/zookeeper-{{zookeeper_version}}/apache-zookeeper-{{zookeeper_version}}-bin.tar.gz"
zookeeper_download_dest: /tmp/zookeeper-{{zookeeper_version}}-bin.tar.gz
zookeeper_user: zookeeper
zookeeper_group: zookeeper
zookeeper_home: /usr/lib/zookeeper/apache-zookeeper-{{zookeeper_version}}-bin
zookeeper_conf_dir: /etc/zookeeper/conf
zookeeper_log_dir: /var/log/zookeeper
zookeeper_pid_dir: /var/run/zookeeper
zookeeper_data_dir: /zkpr/data
zookeeper_data_log_dir: /zkpr/data-log
zookeeper_myid_file: "{{zookeeper_data_dir}}/myid"
zookeeper_client_port: 2181
zookeeper_peer_port: 2888
zookeeper_leader_port: 3888
zookeeper_server_id: 1
zookeeper_servers: "server.1=localhost:2888:3888 server.2=localhost:2888:3888 server.3=localhost:2888:3888"
zookeeper_servers_list: "server.1=localhost:2888:3888 server.2=localhost:2888:3888 server.3=localhost:2888:3888"
